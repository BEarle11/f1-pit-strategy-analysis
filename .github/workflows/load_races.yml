# Runs the F1 pipeline automatically after each race weekend.
# Place this file at  .github/workflows/load_races.yml  in the ROOT of your repo.

name: Load new F1 races

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday at 09:00 UTC (5 a.m. Eastern), after every race
  workflow_dispatch:       # adds a "Run workflow" button in GitHub for manual runs

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v

  load:
    needs: test            # only load data if every test passed
    runs-on: ubuntu-latest
    permissions:
      contents: write      # lets this job commit the refreshed app data
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Load finished races into Snowflake
        run: python load_race.py --auto
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}

      - name: Export data for the Streamlit app
        run: python export_app_data.py
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}

      # Commit the new data files only if they changed. Streamlit Community Cloud
      # redeploys the app automatically whenever the repo changes.
      - name: Commit refreshed app data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "No new race data; nothing to commit."
          else
            git commit -m "Refresh app data after new races"
            git push
          fi
